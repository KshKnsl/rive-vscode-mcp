name: Release VSIX

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

concurrency:
  group: main-vsix-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Compile extension
        run: npm run compile

      - name: Bump extension version
        id: version
        shell: bash
        run: |
          npm version patch --no-git-tag-version
          version="$(node -p "require('./package.json').version")"
          node --input-type=module - "$version" <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const version = process.argv[2];
          for (const file of ["mcp-server/package.json", "server.json"]) {
            const metadata = JSON.parse(await readFile(file, "utf8"));
            metadata.version = version;
            if (file.endsWith("package.json")) {
              metadata.version = version;
            } else {
              metadata.packages[0].version = version;
            }
            await writeFile(file, `${JSON.stringify(metadata, null, 2)}\n`);
          }
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json mcp-server/package.json server.json
          git commit -m "chore: release v${version}"
          git push origin HEAD:main
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        id: package
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          vsix="rive-vscode-mcp-${version}.vsix"
          npx --yes @vscode/vsce package --out "$vsix"
          echo "path=$vsix" >> "$GITHUB_OUTPUT"

      - name: Publish to Visual Studio Marketplace
        env:
          VSIX_PATH: ${{ steps.package.outputs.path }}
        run: npx --yes @vscode/vsce publish --oidc --skip-duplicate --packagePath "$VSIX_PATH"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX_PATH: ${{ steps.package.outputs.path }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$VSIX_PATH" --clobber
          else
            gh release create "$tag" "$VSIX_PATH" \
              --title "Rive VS Code MCP ${tag}" \
              --notes "Automated VSIX built from commit ${GITHUB_SHA} on main." \
              --target "${{ steps.version.outputs.commit }}"
          fi

      - name: Update npm CLI for OIDC publishing
        run: npm install --global npm@11.5.1

      - name: Publish standalone MCP server to npm
        env:
          PACKAGE_NAME: rive-vscode-mcp-server
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          pack_output="$(npm pack --dry-run ./mcp-server 2>&1)"
          printf '%s\n' "$pack_output"
          if grep -Eq 'auto-corrected some errors|bin\[.*\] script name .* was invalid' <<< "$pack_output"; then
            echo "npm modified package metadata while packing; refusing to publish a broken CLI." >&2
            exit 1
          fi

          if view_result="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>&1)"; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published."
          elif grep -q 'E404' <<< "$view_result"; then
            npm publish --access public --provenance ./mcp-server
          else
            printf '%s\n' "$view_result" >&2
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Download and verify MCP Registry publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        shell: bash
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          chmod +x mcp-publisher

      - name: Publish server to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher validate server.json
          ./mcp-publisher publish
