name: Release VSIX

on:
  push:
    branches:
      - main  

permissions:
  contents: write
  id-token: write

concurrency:
  group: main-vsix-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Compile extension
        run: npm run compile

      - name: Bump extension version
        id: version
        shell: bash
        run: |
          npm version patch --no-git-tag-version
          version="$(node -p "require('./package.json').version")"
          node --input-type=module - "$version" <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const version = process.argv[2];
          for (const file of ["mcp-server/package.json", "server.json"]) {
            const metadata = JSON.parse(await readFile(file, "utf8"));
            metadata.version = version;
            if (file.endsWith("package.json")) {
              metadata.version = version;
            } else {
              metadata.packages[0].version = version;
            }
            await writeFile(file, `${JSON.stringify(metadata, null, 2)}\n`);
          }
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json mcp-server/package.json server.json
          git commit -m "chore: release v${version}"
          git push origin HEAD:main
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        id: package
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          vsix="rive-vscode-mcp-${version}.vsix"
          npx --yes @vscode/vsce package --out "$vsix"
          echo "path=$vsix" >> "$GITHUB_OUTPUT"

      - name: Publish to Visual Studio Marketplace
        env:
          VSIX_PATH: ${{ steps.package.outputs.path }}
        run: npx --yes @vscode/vsce publish --oidc --skip-duplicate --packagePath "$VSIX_PATH"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
          VSIX_PATH: ${{ steps.package.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$OVSX_PAT" ]]; then
            echo "::warning::Open VSX publishing skipped. Add OPEN_VSX_TOKEN to the production environment secrets."
            exit 0
          fi
          npx --yes ovsx publish "$VSIX_PATH" -p "$OVSX_PAT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX_PATH: ${{ steps.package.outputs.path }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$VSIX_PATH" --clobber
          else
            gh release create "$tag" "$VSIX_PATH" \
              --title "Rive VS Code MCP ${tag}" \
              --notes "Automated VSIX built from commit ${GITHUB_SHA} on main." \
              --target "${{ steps.version.outputs.commit }}"
          fi

      - name: Update npm CLI for OIDC publishing
        run: npm install --global npm@11.5.1

      - name: Publish standalone MCP server to npm
        env:
          PACKAGE_NAME: rive-vscode-mcp-server
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          pack_output="$(npm pack --dry-run ./mcp-server 2>&1)"
          printf '%s\n' "$pack_output"
          if grep -Eq 'auto-corrected some errors|bin\[.*\] script name .* was invalid' <<< "$pack_output"; then
            echo "npm modified package metadata while packing; refusing to publish a broken CLI." >&2
            exit 1
          fi

          if view_result="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>&1)"; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published."
          elif grep -q 'E404' <<< "$view_result"; then
            npm publish --access public --provenance ./mcp-server
          else
            printf '%s\n' "$view_result" >&2
            exit 1
          fi

      - name: Check out official MCP Registry source
        uses: actions/checkout@v4
        with:
          repository: modelcontextprotocol/registry
          ref: ad119f3d478a936c95d73b291c5fbc106231f7bc
          path: mcp-registry

      - name: Set up Go for MCP publisher
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: mcp-registry/go.sum

      - name: Build official MCP Registry publisher
        working-directory: mcp-registry
        run: go build -trimpath -o ../mcp-publisher ./cmd/publisher

      - name: Publish server to MCP Registry
        env:
          PACKAGE_NAME: rive-vscode-mcp-server
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher validate server.json
          for attempt in $(seq 1 20); do
            if publish_output="$(./mcp-publisher publish 2>&1)"; then
              printf '%s\n' "$publish_output"
              exit 0
            fi

            printf '%s\n' "$publish_output"
            if ! grep -Fq "version '${PACKAGE_VERSION}' was not found" <<< "$publish_output"; then
              exit 1
            fi

            if (( attempt == 20 )); then
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is still not visible to the MCP Registry after 10 minutes." >&2
              exit 1
            fi

            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is not visible to the MCP Registry yet; retrying in 30 seconds (${attempt}/20)."
            sleep 30
          done
