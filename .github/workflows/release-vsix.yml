name: Release VSIX

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Compile extension
        run: npm run compile

      - name: Package VSIX
        id: package
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          short_sha="${GITHUB_SHA::7}"
          vsix="rive-vscode-mcp-${version}-${short_sha}.vsix"
          npx --yes @vscode/vsce package --out "$vsix"
          echo "path=$vsix" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX_PATH: ${{ steps.package.outputs.path }}
        shell: bash
        run: |
          tag="main-${GITHUB_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$VSIX_PATH" --clobber
          else
            gh release create "$tag" "$VSIX_PATH" \
              --title "Rive VS Code MCP ${GITHUB_SHA::7}" \
              --notes "Automated VSIX built from commit ${GITHUB_SHA} on main." \
              --target "$GITHUB_SHA"
          fi
